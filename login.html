<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>تسجيل الدخول</title>
  <style>
    :root{--bg:#0b1220;--card:#101a2b;--ink:#e8f0ff;--muted:#9fb3d1;--accent:#4f8cff;--line:#1a2945}
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;display:grid;place-items:center;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
    h1{margin:0 0 12px;font-size:20px}
    .muted{color:var(--muted);font-size:13px}
    .row{display:grid;gap:10px}
    input,button{width:100%;padding:12px;border-radius:12px;border:1px solid #243756;background:#0f1a2d;color:var(--ink)}
    .btn{cursor:pointer;font-weight:700}
    .btn.primary{background:var(--accent);border-color:#3f70cc}
    .err{color:#ffb3b3;margin-top:8px;min-height:20px}
  </style>
</head>
<body>
  <main class="card">
    <h1>تسجيل الدخول</h1>
    <div class="row">
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button id="loginBtn" class="btn primary">دخول</button>
      <div id="loginMsg" class="err"></div>
      <p class="muted">تأكد إضافة نطاق <code>mjeed119.github.io</code> داخل Firebase Authentication → Settings → Authorized domains.</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.firebasestorage.app",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4"
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
  
    const $   = (id)=>document.getElementById(id);
    const msg = $("loginMsg");
    const emailInput = $("email");
    const passInput  = $("password");
    const btn        = $("loginBtn");
  
    async function loadRoleFor(user){
      // نجرب بالإيميل أولاً
      const emailId = (user.email || "").toLowerCase();
      let ref = doc(db, "users", emailId);
      let snap = await getDoc(ref);
  
      if (!snap.exists()) {
        // لو ما لقيْنا وثيقة بإيميل، نجرب الـ UID
        ref  = doc(db, "users", user.uid);
        snap = await getDoc(ref);
      }
      if (!snap.exists()) return null;
      return snap.data();
    }
  
    btn.onclick = async () => {
      msg.textContent = "";
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
        const user = cred.user;
  
        const data = await loadRoleFor(user);
        if (!data) {
          msg.textContent = "⚠️ حسابك مسجّل لكن لا توجد صلاحية (users/{email أو uid}).";
          return;
        }
  
        const role = (data.role || "teacher").toLowerCase();
        if (role === "admin") {
          location.href = "admin-panel.html";
        } else {
          location.href = "teacher.html";
        }
      } catch (err) {
        console.error(err);
        // نعرض الكود عشان تعرف السبب مباشرة
        msg.textContent = "❌ " + (err.code || "خطأ في تسجيل الدخول. تأكد من البريد/كلمة المرور ومن الدومين المصرّح.");
      }
    };
  </script>
  
</body>
</html>
