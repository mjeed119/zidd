<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المشرف</title>
  <style>
    :root { --bg:#0b1220; --card:#101a2b; --ink:#e8f0ff; --muted:#9fb3d1; --accent:#4f8cff; --danger:#ff5d5d; --ok:#2ecc71; --line:#1a2945; }
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{padding:18px 20px;background:#0d1728;border-bottom:1px solid #1b2a44;display:flex;gap:10px;align-items:center;justify-content:space-between}
    header h1{font-size:18px;margin:0}
    header .right{display:flex;gap:8px;align-items:center}
    main{max-width:1200px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid #14213b;border-radius:14px;padding:16px;margin-bottom:16px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    input,button,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #243756;background:#0f1a2d;color:var(--ink)}
    input::placeholder,textarea::placeholder{color:#6d85aa}
    button{cursor:pointer}
    .primary{background:var(--accent);border-color:#3f70cc}
    .danger{background:var(--danger);border-color:#d94d4d}
    .ghost{background:#0f1a2d}
    .ok{background:var(--ok);border-color:#22b063}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center}
    th{color:#b9cae6;background:#0f192c;position:sticky;top:0}
    .tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
    .pill{padding:6px 10px;border-radius:999px;background:#0f1a2d;border:1px solid #223457}
    .hide{display:none}
    a.link{color:#8fb6ff;text-decoration:none}
    .mini{padding:6px 10px;border-radius:8px}
    @media print{
      header,.no-print,.row .ghost,.row .primary,.row .ok,.row .danger{ display:none !important; }
      body{ background:#fff; color:#000; }
      .card{ border:none; box-shadow:none; }
      th,td{ border:1px solid #999; }
      select{appearance:none;border:none}
    }
  </style>
</head>

<body>
  <header class="no-print">
    <h1>لوحة تحكم المشرف</h1>
    <div class="right">
      <span class="muted">المستخدم: <span id="who">—</span></span>
      <button class="ghost" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <main>
    <!-- تسجيل الدخول -->
    <section id="loginView" class="card">
      <h2>تسجيل الدخول</h2>
      <div class="row">
        <input id="email" type="email" placeholder="البريد الإلكتروني"/>
        <input id="password" type="password" placeholder="كلمة المرور"/>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="loginBtn">دخول</button>
      </div>
      <p id="loginMsg" class="muted"></p>
      <p class="muted">تأكد إضافة نطاق <code>mjeed119.github.io</code> في Authentication → Settings → Authorized domains.</p>
    </section>

    <!-- اللوحة -->
    <section id="panelView" class="hide">
      <!-- إضافة / تحديث طالب -->
      <div class="card no-print">
        <h3>إضافة / تحديث طالب</h3>
        <div class="row">
          <input id="st_id" placeholder="Document ID (مثلاً رقم الهوية) *" />
          <input id="st_name" placeholder="الاسم" />
          <input id="st_nid" placeholder="رقم الهوية (اختياري)" />
          <input id="st_class" placeholder="الفصل (مثال: 105)" />
        </div>
        <div class="row">
          <input id="st_hw" type="number" placeholder="Hw" />
          <input id="st_classwork" type="number" placeholder="Classwork" />
          <input id="st_activity" type="number" placeholder="Activity" />
          <input id="st_research" type="number" placeholder="Research" />
        </div>
        <div class="row">
          <input id="st_theoretical" type="number" placeholder="Theoretical" />
          <input id="st_practical"   type="number" placeholder="Practical" />
          <input id="st_absence" type="number" placeholder="Absence (لا يدخل في المجموع)" />
          <!-- استبدلت حقل النص بقائمة ملاحظات جاهزة -->
          <select id="st_notes"></select>
        </div>
        <div class="row">
          <button class="ok" id="saveBtn">حفظ / تحديث</button>
          <button class="ghost" id="clearBtn">تفريغ الحقول</button>
        </div>
      </div>

      <!-- فلترة / بحث / طباعة -->
      <div class="card no-print">
        <div class="row">
          <input id="filterClass" placeholder="فلترة بالفصل (مثال: 105)" />
          <input id="searchInput" placeholder="بحث بالاسم أو ID" />
          <button class="ghost" id="refreshBtn">تحديث القائمة</button>
          <button class="primary" id="printBtn">طباعة الكشف</button>
          <a class="link" href="https://console.firebase.google.com/" target="_blank" rel="noopener">فتح Firebase Console ↗</a>
        </div>
      </div>

      <!-- جدول الطلاب -->
      <div class="card" style="overflow:auto">
        <h3>قائمة الطلاب</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>الاسم</th>
              <th>الفصل</th>
              <th class="no-print">نقل للفصل</th>
              <th>Hw</th>
              <th>Classwork</th>
              <th>Activity</th>
              <th>Research</th>
              <th>Theoretical</th>
              <th>Practical</th>
              <th>الغياب</th>
              <th>المجموع</th>
              <th>ملاحظات</th>
              <th class="no-print">إجراءات</th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Firebase + المنطق -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    /* إعدادات مشروعك */
    const firebaseConfig = {
      apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.firebasestorage.app",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4"
    };

    /* Init */
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    /* Helpers */
    const $   = (id)=>document.getElementById(id);
    const num = (v)=>Number(v||0);
    const coll= new Intl.Collator('ar');
    const norm= (s)=> (s||"").toString().trim().toLowerCase();
    const computeTotal = (hw,cw,ac,rs,th,pr)=> num(hw)+num(cw)+num(ac)+num(rs)+num(th)+num(pr);

    // قائمة الملاحظات الجاهزة
    const NOTES = [
      "لا يوجد",
      "مميز",
      "لم يسلم أوراق العمل للتصحيح",
      "كثير الغياب",
      "عليه أن يكون أكثر جدية",
      "تحويل إلى الوكيل"
    ];
    function notesOptionsHTML(selected=""){
      return NOTES.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join("");
    }
    // تعبئة قائمة نموذج الإضافة
    (function fillNotesSelect(){
      const sel = $("st_notes");
      sel.innerHTML = notesOptionsHTML("لا يوجد");
    })();

    /* Auth */
    onAuthStateChanged(auth,(user)=>{
      $("loginView").classList.toggle("hide", !!user);
      $("panelView").classList.toggle("hide", !user);
      if(user){ $("who").textContent=user.email||"—"; loadStudents(); }
    });
    $("loginBtn").onclick = async()=>{
      $("loginMsg").textContent="";
      try{ await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
      catch(e){ $("loginMsg").textContent="❌ خطأ في تسجيل الدخول"; console.error(e); }
    };
    $("logoutBtn").onclick = async()=>{ await signOut(auth); };

    /* === إضافة/تحديث طالب يدوي === */
    $("saveBtn").onclick = saveStudent;
    $("clearBtn").onclick = clearForm;

    function collectStudentForm(){
      const data = {
        Name: $("st_name").value.trim(),
        Nid_hash: $("st_nid").value.trim(),
        Class: $("st_class").value.trim(),
        Hw: num($("st_hw").value),
        Classwork: num($("st_classwork").value),
        Activity: num($("st_activity").value),
        Research: num($("st_research").value),
        Theoretical: num($("st_theoretical").value),
        Practical: num($("st_practical").value),
        Absence: num($("st_absence").value),
        Notes: $("st_notes").value || "لا يوجد"
      };
      data.Total = computeTotal(data.Hw,data.Classwork,data.Activity,data.Research,data.Theoretical,data.Practical);
      return data;
    }

    async function saveStudent(){
      const id = norm($("st_id").value);
      if(!id){ alert("أدخل Document ID"); return; }
      const data = collectStudentForm();
      await setDoc(doc(db,"students",id), data, {merge:true});
      alert("✅ تم الحفظ");
      clearForm();
      loadStudents(id);
    }

    function clearForm(){
      ["st_id","st_name","st_nid","st_class","st_hw","st_classwork","st_activity","st_research","st_theoretical","st_practical","st_absence"].forEach(id => $(id).value="");
      $("st_notes").value = "لا يوجد";
    }

    /* === CRUD من الجدول === */
    window.deleteStudent = async(id)=>{
      if(!confirm("حذف الطالب؟")) return;
      await deleteDoc(doc(db,"students",id));
      loadStudents();
    };

    // تعديل مباشر داخل الخلية الرقمية أو الفصل
    window.edit = async(id, field, td)=>{
      const ref = doc(db,"students",id);
      const snap = await getDoc(ref);
      if(!snap.exists()) return;
      const data = snap.data();
      data[field] = field==="Class" ? td.textContent.trim() : num(td.textContent);
      data.Total  = computeTotal(data.Hw,data.Classwork,data.Activity,data.Research,data.Theoretical,data.Practical);
      await setDoc(ref, data, { merge:true });
      loadStudents(id);
    };

    // أسهم زيادة/نقصان
    window.bump = async(id, field, delta)=>{
      const ref = doc(db,"students",id);
      const snap = await getDoc(ref);
      if(!snap.exists()) return;
      const s = snap.data();
      const updated = { ...s, [field]: num(s[field])+delta };
      updated.Total = computeTotal(updated.Hw,updated.Classwork,updated.Activity,updated.Research,updated.Theoretical,updated.Practical);
      await setDoc(ref, updated);
      loadStudents(id);
    };

    // تغيير الملاحظة من الجدول
    window.setNote = async (id, val) => {
      await setDoc(doc(db,"students",id), { Notes: val }, { merge:true });
      // ما نحتاج reload كامل، لكن للحفاظ على الترتيب/الفلاتر نخليه موحد:
      // لو حاب بدون إعادة تحميل علّق السطر التالي.
      // loadStudents(id);
    };

    /* === عرض القائمة (فلترة + بحث + قوائم الفصول) === */
    $("filterClass").addEventListener("input", ()=> loadStudents());
    $("searchInput").addEventListener("input", ()=> loadStudents());
    $("refreshBtn").addEventListener("click", ()=> loadStudents());
    $("printBtn").addEventListener("click", ()=> window.print());

    // نقل الطالب لفصل آخر
    window.moveClass = async (id) => {
      const sel = document.getElementById('mv-'+id);
      const manual = document.getElementById('mvtext-'+id);
      const newClass = (manual?.value || sel?.value || '').trim();
      if(!newClass){ alert('اختر فصلًا من القائمة أو اكتب فصلًا جديدًا'); return; }
      await setDoc(doc(db, 'students', id), { Class: newClass }, { merge: true });
      if (manual) manual.value = '';
      loadStudents(id);
    };

    async function loadStudents(focusId){
      const klass  = $("filterClass").value.trim();
      const search = norm($("searchInput").value);
      $("studentsBody").innerHTML = "<tr><td colspan='14'>جاري التحميل…</td></tr>";

      const base = collection(db,"students");
      const qy   = klass ? query(base, where("Class","==",klass)) : base;
      const qs   = await getDocs(qy);

      let arr = [];
      qs.forEach(d=>{ const s=d.data(); s.id=d.id; arr.push(s); });

      // ترتيب هجائي عربي بالاسم
      arr.sort((a,b)=> coll.compare(a.Name||"", b.Name||""));

      // بحث بالاسم أو الـID
      if(search){
        arr = arr.filter(s => norm(s.Name).includes(search) || norm(s.id).includes(search));
      }

      // استخرج قائمة الفصول
      const classSet = new Set();
      arr.forEach(s => { if (s.Class) classSet.add(String(s.Class)); });
      const classList = Array.from(classSet).sort(coll.compare);
      const classOptionsHTML = (current) =>
        ['<option value="">— اختر —</option>']
          .concat(classList.map(c => `<option value="${c}" ${String(current)===String(c)?'selected':''}>${c}</option>`))
          .join('');

      const rows = arr.map(s => `
        <tr id="row-${s.id}">
          <td class="pill">${s.id}</td>
          <td>${s.Name||""}</td>
          <td contenteditable onblur="edit('${s.id}','Class',this)">${s.Class||""}</td>

          <!-- عمود نقل للفصل -->
          <td class="no-print" style="min-width:220px;display:flex;gap:6px;align-items:center;justify-content:center">
            <select id="mv-${s.id}" style="width:110px">
              ${classOptionsHTML(s.Class||"")}
            </select>
            <input id="mvtext-${s.id}" placeholder="أو اكتب فصل جديد" style="width:120px" />
            <button class="mini primary" onclick="moveClass('${s.id}')">نقل</button>
          </td>

          <td contenteditable onblur="edit('${s.id}','Hw',this)">${num(s.Hw)}</td>
          <td contenteditable onblur="edit('${s.id}','Classwork',this)">${num(s.Classwork)}</td>
          <td contenteditable onblur="edit('${s.id}','Activity',this)">${num(s.Activity)}</td>
          <td contenteditable onblur="edit('${s.id}','Research',this)">${num(s.Research)}</td>
          <td contenteditable onblur="edit('${s.id}','Theoretical',this)">${num(s.Theoretical)}</td>
          <td contenteditable onblur="edit('${s.id}','Practical',this)">${num(s.Practical)}</td>
          <td contenteditable onblur="edit('${s.id}','Absence',this)">${num(s.Absence)}</td>
          <td><strong>${num(s.Total)}</strong></td>

          <!-- ملاحظات: قائمة جاهزة تحفظ عند التغيير -->
          <td>
            <select onchange="setNote('${s.id}', this.value)">
              ${notesOptionsHTML(s.Notes || "لا يوجد")}
            </select>
          </td>

          <td class="tools no-print">
            <button class="mini ok"    onclick="bump('${s.id}','Hw',1)">+ واجب</button>
            <button class="mini ghost" onclick="bump('${s.id}','Hw',-1)">- واجب</button>

            <button class="mini ok"    onclick="bump('${s.id}','Classwork',1)">+ صفي</button>
            <button class="mini ghost" onclick="bump('${s.id}','Classwork',-1)">- صفي</button>

            <button class="mini ok"    onclick="bump('${s.id}','Activity',1)">+ نشاط</button>
            <button class="mini ghost" onclick="bump('${s.id}','Activity',-1)">- نشاط</button>

            <button class="mini ok"    onclick="bump('${s.id}','Research',1)">+ بحث</button>
            <button class="mini ghost" onclick="bump('${s.id}','Research',-1)">- بحث</button>

            <button class="mini ok"    onclick="bump('${s.id}','Theoretical',1)">+ نظري</button>
            <button class="mini ghost" onclick="bump('${s.id}','Theoretical',-1)">- نظري</button>

            <button class="mini ok"    onclick="bump('${s.id}','Practical',1)">+ عملي</button>
            <button class="mini ghost" onclick="bump('${s.id}','Practical',-1)">- عملي</button>

            <button class="mini ok"    onclick="bump('${s.id}','Absence',1)">+ غياب</button>
            <button class="mini ghost" onclick="bump('${s.id}','Absence',-1)">- غياب</button>

            <button class="mini danger" onclick="deleteStudent('${s.id}')">حذف</button>
          </td>
        </tr>
      `);

      $("studentsBody").innerHTML = rows.length ? rows.join("") : `<tr><td colspan="14">لا يوجد نتائج</td></tr>`;

      if(focusId){
        const row = $("row-"+focusId);
        if(row) row.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }
  </script>
</body>
</html>
