<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المشرف</title>
  <style>
    :root { --bg:#0b1220; --card:#101a2b; --ink:#e8f0ff; --muted:#9fb3d1; --accent:#4f8cff; --danger:#ff5d5d; --ok:#2ecc71; }
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{padding:18px 20px;background:#0d1728;border-bottom:1px solid #1b2a44;display:flex;gap:10px;align-items:center;justify-content:space-between}
    header h1{font-size:18px;margin:0}
    header .right{display:flex;gap:8px;align-items:center}
    main{max-width:1100px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid #14213b;border-radius:14px;padding:16px;margin-bottom:16px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
    input,select,button{width:100%;padding:10px;border-radius:10px;border:1px solid #243756;background:#0f1a2d;color:var(--ink)}
    input::placeholder{color:#6d85aa}
    button{cursor:pointer}
    .primary{background:var(--accent);border-color:#3f70cc}
    .danger{background:var(--danger);border-color:#d94d4d}
    .ghost{background:#0f1a2d}
    .ok{background:var(--ok);border-color:#22b063}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid #1a2945;text-align:center}
    th{color:#b9cae6;background:#0f192c}
    .tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
    .pill{padding:6px 10px;border-radius:999px;background:#0f1a2d;border:1px solid #223457}
    .hide{display:none}
    a.link{color:#8fb6ff;text-decoration:none}
    .mini{padding:6px 10px;border-radius:8px}
  </style>

  <!-- Firebase v12 (Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // 🔧 إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.firebasestorage.app",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4",
      measurementId: "G-7FW8J3J4GN"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // UI Elements
    const loginView   = () => document.getElementById("loginView");
    const panelView   = () => document.getElementById("panelView");
    const loginMsg    = () => document.getElementById("loginMsg");
    const studentsTbody = () => document.getElementById("studentsBody");
    const totalSpan   = () => document.getElementById("calcTotal");

    // (اختياري) إن كنت تستخدم تصدير CSV لاحقًا
    let _lastLoaded = [];

    // Auth state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginView().classList.add("hide");
        panelView().classList.remove("hide");
        document.getElementById("who").textContent = user.email || "مشرف";
        loadStudents();
      } else {
        panelView().classList.add("hide");
        loginView().classList.remove("hide");
      }
    });

    // Login
    window.login = async () => {
      const email = document.getElementById("email").value.trim();
      const pass  = document.getElementById("password").value.trim();
      loginMsg().textContent = "";
      try{
        await signInWithEmailAndPassword(auth, email, pass);
      }catch(err){
        loginMsg().textContent = "خطأ في تسجيل الدخول";
        console.error(err);
      }
    };

    window.logout = async () => { await signOut(auth); };

    // ===== Helpers =====
    const num = (v) => Number(v || 0);
    // 🔢 المجموع بدون الغياب: Hw + Classwork + Activity + Research + Theoretical + Practical
    const computeTotal = (hw, classwork, activity, research, theoretical, practical) =>
      num(hw)+num(classwork)+num(activity)+num(research)+num(theoretical)+num(practical);

    // ===== CRUD =====
    // Add/Update student
    window.saveStudent = async () => {
      const id        = document.getElementById("st_id").value.trim();
      if(!id){ alert("أدخل رقم الهوية/المعرف كـ Document ID"); return; }
      const name      = document.getElementById("st_name").value.trim();
      const nidHash   = document.getElementById("st_nid").value.trim();
      const klass     = document.getElementById("st_class").value.trim();

      const hw        = num(document.getElementById("st_hw").value);
      const classwork = num(document.getElementById("st_classwork").value);
      const activity  = num(document.getElementById("st_activity").value);
      const research  = num(document.getElementById("st_research").value);      // جديد
      const theoretical = num(document.getElementById("st_theoretical").value); // جديد
      const practical   = num(document.getElementById("st_practical").value);   // جديد
      const absence   = num(document.getElementById("st_absence").value);
      const notes     = document.getElementById("st_notes").value.trim();

      const total     = computeTotal(hw,classwork,activity,research,theoretical,practical);

      const payload = {
        Name: name,
        Nid_hash: nidHash,
        Class: klass,
        Hw: hw,
        Classwork: classwork,
        Activity: activity,
        Research: research,
        Theoretical: theoretical,
        Practical: practical,
        Absence: absence,
        Notes: notes,
        Total: total
      };

      try{
        await setDoc(doc(db,"students", id), payload, { merge:true });
        alert("🚀 تم الحفظ / التحديث بنجاح");
        clearForm();
        loadStudents();
      }catch(err){ console.error(err); alert("تعذر الحفظ"); }
    };

    // Delete
    window.deleteStudent = async (id) => {
      if(!confirm("هل تريد حذف هذا الطالب؟")) return;
      try{
        await deleteDoc(doc(db,"students",id));
        loadStudents();
      }catch(e){ console.error(e); alert("تعذر الحذف"); }
    };

    // Increment/Decrement field
    window.bump = async (id, field, delta) => {
      try{
        const ref = doc(db, "students", id);
        const snap = await getDoc(ref);
        if(!snap.exists()) return;
        const data = snap.data();
        const updated = { ...data, [field]: num(data[field])+delta };
        // أعد احتساب المجموع (بدون الغياب)
        updated.Total = computeTotal(
          updated.Hw, updated.Classwork, updated.Activity,
          updated.Research || 0, updated.Theoretical || 0, updated.Practical || 0
        );
        await setDoc(ref, updated);
        loadStudents();
      }catch(e){ console.error(e); alert("تعذر التحديث"); }
    };

    // ========= NEW: ترتيب هجائي عربي مستقر =========
    async function loadStudents() {
      const klassFilter = document.getElementById("filterClass").value.trim();
      studentsTbody().innerHTML = "<tr><td colspan='13' class='muted'>...جاري التحميل</td></tr>";
      try{
        let qRef = collection(db,"students");
        let qy = klassFilter ? query(qRef, where("Class","==",klassFilter)) : query(qRef);
        const qs = await getDocs(qy);

        // نجمع النتائج في مصفوفة موحدة
        const arr = [];
        qs.forEach(d=>{
          const s = d.data() || {};
          arr.push({
            id: d.id,
            Name: s.Name || "",
            Class: s.Class || "",
            Hw: Number(s.Hw || 0),
            Classwork: Number(s.Classwork || 0),
            Activity: Number(s.Activity || 0),
            Research: Number(s.Research || 0),
            Theoretical: Number(s.Theoretical || 0),
            Practical: Number(s.Practical || 0),
            Absence: Number(s.Absence || 0),
            Total: Number(s.Total || 0),
            Notes: s.Notes || ""
          });
        });

        // ✅ ترتيب أبجدي عربي: بدون فلتر ← (الفصل ثم الاسم) | مع الفلتر ← (الاسم فقط)
        const coll = new Intl.Collator('ar');
        if (!klassFilter) {
          arr.sort((a,b)=>{
            const c = coll.compare(String(a.Class), String(b.Class));
            return c !== 0 ? c : coll.compare(a.Name, b.Name);
          });
        } else {
          arr.sort((a,b)=> coll.compare(a.Name, b.Name));
        }

        // (اختياري) حفظ نسخة للتصدير إن كنت تستخدم exportCSV
        _lastLoaded = arr.map(s => ({
          ID: s.id, Name: s.Name, Class: s.Class, Hw: s.Hw, Classwork: s.Classwork,
          Activity: s.Activity, Research: s.Research, Theoretical: s.Theoretical,
          Practical: s.Practical, Absence: s.Absence, Total: s.Total, Notes: s.Notes
        }));

        // بناء الصفوف
        const rows = arr.map(s => `
          <tr>
            <td class="pill">${s.id}</td>
            <td>${s.Name}</td>
            <td>${s.Class}</td>
            <td>${s.Hw}</td>
            <td>${s.Classwork}</td>
            <td>${s.Activity}</td>
            <td>${s.Research}</td>
            <td>${s.Theoretical}</td>
            <td>${s.Practical}</td>
            <td>${s.Absence}</td>
            <td><strong>${s.Total}</strong></td>
            <td>${s.Notes}</td>
            <td class="tools">
              <button class="mini ghost" onclick="bump('${s.id}','Hw',1)">+ واجب</button>
              <button class="mini ghost" onclick="bump('${s.id}','Hw',-1)">- واجب</button>

              <button class="mini ghost" onclick="bump('${s.id}','Classwork',1)">+ صفي</button>
              <button class="mini ghost" onclick="bump('${s.id}','Classwork',-1)">- صفي</button>

              <button class="mini ghost" onclick="bump('${s.id}','Activity',1)">+ نشاط</button>
              <button class="mini ghost" onclick="bump('${s.id}','Activity',-1)">- نشاط</button>

              <button class="mini ghost" onclick="bump('${s.id}','Research',1)">+ بحث</button>
              <button class="mini ghost" onclick="bump('${s.id}','Research',-1)">- بحث</button>

              <button class="mini ghost" onclick="bump('${s.id}','Theoretical',1)">+ نظري</button>
              <button class="mini ghost" onclick="bump('${s.id}','Theoretical',-1)">- نظري</button>

              <button class="mini ghost" onclick="bump('${s.id}','Practical',1)">+ عملي</button>
              <button class="mini ghost" onclick="bump('${s.id}','Practical',-1)">- عملي</button>

              <button class="mini ghost" onclick="bump('${s.id}','Absence',1)">+ غياب</button>
              <button class="mini ghost" onclick="bump('${s.id}','Absence',-1)">- غياب</button>

              <button class="mini danger" onclick="deleteStudent('${s.id}')">حذف</button>
            </td>
          </tr>
        `);

        studentsTbody().innerHTML = rows.length ? rows.join("") : `<tr><td colspan="13" class="muted">لا يوجد طلاب</td></tr>`;
      }catch(e){
        console.error(e);
        studentsTbody().innerHTML = `<tr><td colspan="13" class="muted">تعذر التحميل</td></tr>`;
      }
    }

    // UI helpers
    function val(id){ return document.getElementById(id).value = ""; }
    function clearForm(){
      ["st_id","st_name","st_nid","st_class","st_notes",
       "st_hw","st_classwork","st_activity","st_research","st_theoretical","st_practical","st_absence"
      ].forEach(id=> val(id));
      totalSpan().textContent = "0";
    }

    // live total calc
    ["st_hw","st_classwork","st_activity","st_research","st_theoretical","st_practical"].forEach(id=>{
      document.addEventListener("input",(e)=>{
        if(e.target.id===id){
          const hw = num(document.getElementById("st_hw").value);
          const cw = num(document.getElementById("st_classwork").value);
          const ac = num(document.getElementById("st_activity").value);
          const rs = num(document.getElementById("st_research").value);
          const th = num(document.getElementById("st_theoretical").value);
          const pr = num(document.getElementById("st_practical").value);
          totalSpan().textContent = computeTotal(hw,cw,ac,rs,th,pr);
        }
      });
    });

    // filters
    window.applyFilter = () => loadStudents();
  </script>
</head>

<body>
  <header>
    <h1>لوحة تحكم المشرف</h1>
    <div class="right">
      <span class="muted">المستخدم: <span id="who">—</span></span>
      <button class="ghost" onclick="logout()">تسجيل الخروج</button>
    </div>
  </header>

  <main>
    <!-- شاشة تسجيل الدخول -->
    <section id="loginView" class="card">
      <h2>تسجيل الدخول</h2>
      <div class="row">
        <input id="email" type="email" placeholder="البريد الإلكتروني"/>
        <input id="password" type="password" placeholder="كلمة المرور"/>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" onclick="login()">دخول</button>
      </div>
      <p id="loginMsg" class="muted"></p>
      <p class="muted">تأكد أن نطاق <code>mjeed119.github.io</code> مضاف في Authorized domains داخل Authentication.</p>
    </section>

    <!-- اللوحة بعد تسجيل الدخول -->
    <section id="panelView" class="hide">
      <!-- إضافة / تحديث طالب -->
      <div class="card">
        <h3>إضافة / تحديث طالب</h3>
        <div class="row">
          <input id="st_id" placeholder="Document ID (مثلاً رقم الهوية) *" />
          <input id="st_name" placeholder="الاسم" />
          <input id="st_nid" placeholder="رقم الهوية (اختياري)" />
          <input id="st_class" placeholder="الفصل (مثال: 105)" />
        </div>
        <div class="row">
          <input id="st_hw" type="number" placeholder="الواجبات Hw" />
          <input id="st_classwork" type="number" placeholder="النشاط الصفي Classwork" />
          <input id="st_activity" type="number" placeholder="نشاط إضافي Activity" />
          <input id="st_research" type="number" placeholder="البحث (من 5)" />
        </div>
        <div class="row">
          <input id="st_theoretical" type="number" placeholder="الاختبار النظري" />
          <input id="st_practical"   type="number" placeholder="الاختبار العملي" />
          <input id="st_absence" type="number" placeholder="الغياب Absence (لا يدخل في المجموع)" />
          <input id="st_notes" placeholder="ملاحظات" />
        </div>
        <div class="row">
          <button class="ok" onclick="saveStudent()">حفظ / تحديث</button>
          <span class="pill">المجموع: <strong id="calcTotal">0</strong></span>
        </div>
      </div>

      <!-- فلترة -->
      <div class="card">
        <div class="row">
          <input id="filterClass" placeholder="فلترة بالفصل (مثال: 105)" />
          <button class="ghost" onclick="applyFilter()">تطبيق الفلتر</button>
          <a class="link" href="https://console.firebase.google.com/" target="_blank">فتح Firebase Console ↗</a>
        </div>
      </div>

      <!-- جدول الطلاب -->
      <div class="card">
        <h3>قائمة الطلاب</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>الاسم</th>
              <th>الفصل</th>
              <th>Hw</th>
              <th>Classwork</th>
              <th>Activity</th>
              <th>Research</th>
              <th>Theoretical</th>
              <th>Practical</th>
              <th>الغياب</th>
              <th>المجموع</th>
              <th>ملاحظات</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
