<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>لوحة المشرف — بطاقات</title>
  <style>
    :root{
      --bg:#0b1220; --card:#101a2b; --ink:#e8f0ff; --muted:#9fb3d1;
      --accent:#4f8cff; --danger:#ff5d5d; --ok:#2ecc71; --line:#1a2945;
    }
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{padding:18px 20px;background:#0d1728;border-bottom:1px solid #1b2a44;display:flex;gap:10px;align-items:center;justify-content:space-between}
    header h1{font-size:18px;margin:0}
    .muted{color:var(--muted)}
    .btn{padding:10px 14px;border-radius:12px;border:1px solid #243756;background:#0f1a2d;color:var(--ink);cursor:pointer}
    .btn.primary{background:var(--accent);border-color:#3f70cc}
    .btn.ok{background:var(--ok);border-color:#22b063}
    .btn.danger{background:var(--danger);border-color:#d94d4d}
    .btn.ghost{background:#0f1a2d}
    input,select,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid #243756;background:#0f1a2d;color:var(--ink)}
    input::placeholder,textarea::placeholder{color:#6d85aa}
    main{max-width:1200px;margin:24px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
    .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .toolbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:10px}

    /* بطاقات */
    .grid{display:grid;grid-template-columns:repeat( auto-fill, minmax(320px,1fr) );gap:12px;margin-top:12px}
    .st-card{background:#0f1a2d;border:1px solid #203253;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
    .st-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .pill{border:1px solid #223457;background:#0f1a2d;border-radius:999px;padding:4px 8px;font-size:12px}
    .name{font-weight:700}
    .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .line{height:1px;background:#1a2945;margin:2px 0}
    .actions{display:flex;flex-wrap:wrap;gap:6px}
    .mini{padding:6px 8px;border-radius:10px;border:1px solid #243756;background:#0f1a2d;color:var(--ink);font-size:13px;cursor:pointer}
    .mini.ok{background:#173a28;border-color:#2b6b49}
    .mini.ghost{background:#0f1a2d}
    .note-wrap{display:flex;gap:6px}
    .total{font-weight:800}
    .hint{font-size:12px;color:var(--muted)}

    /* أدوات الدرجة: لا التفاف + قياسات أوضح */
    .score-row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
    @media (min-width:1024px){
      .st-card .in-num{
        width:88px !important;
        text-align:center;
        font-size:16px;
        padding:8px 6px;
      }
      .st-card .mini{
        width:34px;
        height:34px;
        font-size:18px;
        line-height:32px;
      }
    }

    @media (max-width:900px){
      .row{grid-template-columns:repeat(2,minmax(0,1fr))}
      .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:520px){
      .row{grid-template-columns:1fr}
      .toolbar{grid-template-columns:1fr}
      .nums{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <header>
    <h1>لوحة المشرف — عرض بطاقات</h1>
    <div>
      <span class="muted">المستخدم: <span id="who">—</span></span>
      <button id="logoutBtn" class="btn ghost">تسجيل الخروج</button>
    </div>
  </header>

  <main>
    <!-- تسجيل الدخول -->
    <section id="loginView" class="card">
      <h2 style="margin:0 0 10px">تسجيل الدخول</h2>
      <div class="row">
        <input id="email" type="email" placeholder="البريد الإلكتروني">
        <input id="password" type="password" placeholder="كلمة المرور">
        <button id="loginBtn" class="btn primary">دخول</button>
      </div>
      <p id="loginMsg" class="muted" style="margin-top:8px"></p>
      <p class="hint">تأكد إضافة نطاق <code>mjeed119.github.io</code> في Authentication → Settings → Authorized domains.</p>
    </section>

    <!-- أدوات عامة -->
    <section id="panelView" class="card" style="display:none">
      <h2 style="margin:0 0 10px">إدارة الطلاب</h2>
      <div class="toolbar">
        <input id="filterClass" placeholder="فلترة بالفصل (مثال: 105)">
        <input id="searchInput" placeholder="بحث بالاسم أو ID">
        <button id="refreshBtn" class="btn ghost">تحديث القائمة</button>
        <a class="btn ghost" href="dashboard.html">لوحة المشرف (الجدول)</a>
        <button id="printBtn" class="btn">طباعة</button>
        <a class="btn ghost" href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebase ↗</a>
      </div>

      <!-- إضافة / تحديث سريع -->
      <div class="row" style="margin-top:12px">
        <input id="st_id" placeholder="Document ID *">
        <input id="st_name" placeholder="الاسم">
        <input id="st_class" placeholder="الفصل">
        <select id="st_notes"></select>
        <input id="st_hw" type="number" placeholder="Hw">
        <input id="st_classwork" type="number" placeholder="Classwork">
        <input id="st_activity" type="number" placeholder="Activity">
        <input id="st_research" type="number" placeholder="Research">
        <input id="st_theoretical" type="number" placeholder="Theoretical">
        <input id="st_practical" type="number" placeholder="Practical">
        <input id="st_absence" type="number" placeholder="Absence">
        <input id="custom_note" placeholder="ملاحظة خاصة (اختياري)">
      </div>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
        <button id="saveBtn" class="btn ok">حفظ / تحديث</button>
        <button id="clearBtn" class="btn ghost">تفريغ الحقول</button>
      </div>
    </section>

    <!-- شبكة بطاقات الطلاب -->
    <section id="cardsWrap" class="grid"></section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.firebasestorage.app",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // Helpers
    const $   = (id)=>document.getElementById(id);
    const num = (v)=>Number(v||0);
    const coll= new Intl.Collator('ar');
    const norm= (s)=> (s||"").toString().trim().toLowerCase();
    const computeTotal = (hw,cw,ac,rs,th,pr)=> num(hw)+num(cw)+num(ac)+num(rs)+num(th)+num(pr);

    // ملاحظات جاهزة
    const NOTES = [
      "لا يوجد","مميز","لم يسلم أوراق العمل للتصحيح",
      "كثير الغياب","عليه أن يكون أكثر جدية","تحويل إلى الوكيل"
    ];
    function notesOptionsHTML(selected="لا يوجد"){
      return NOTES.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join("");
    }
    (function(){ $("st_notes").innerHTML = notesOptionsHTML("لا يوجد"); })();

    // Auth
    onAuthStateChanged(auth,(user)=>{
      $("loginView").style.display = user ? "none" : "block";
      $("panelView").style.display = user ? "block" : "none";
      if(user){ $("who").textContent = user.email || "—"; loadCards(); }
    });
    $("loginBtn").onclick = async()=>{
      $("loginMsg").textContent="";
      try{ await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
      catch(e){ $("loginMsg").textContent="❌ خطأ في تسجيل الدخول"; console.error(e); }
    };
    $("logoutBtn").onclick = async()=>{ await signOut(auth); };

    // حفظ سريع
    $("saveBtn").onclick = async ()=>{
      const id = norm($("st_id").value);
      if(!id){ alert("أدخل Document ID"); return; }
      const baseNote = $("st_notes").value || "لا يوجد";
      const custom = ($("custom_note").value||"").trim();
      const finalNote = custom ? `${baseNote} — ${custom}` : baseNote;

      const data = {
        Name: $("st_name").value.trim(),
        Class: $("st_class").value.trim(),
        Hw: num($("st_hw").value),
        Classwork: num($("st_classwork").value),
        Activity: num($("st_activity").value),
        Research: num($("st_research").value),
        Theoretical: num($("st_theoretical").value),
        Practical: num($("st_practical").value),
        Absence: num($("st_absence").value),
        Notes: finalNote
      };
      data.Total = computeTotal(data.Hw,data.Classwork,data.Activity,data.Research,data.Theoretical,data.Practical);
      await setDoc(doc(db,"students",id), data, { merge:true });
      alert("✅ تم الحفظ");
      clearForm();
      loadCards(id);
    };
    $("clearBtn").onclick = clearForm;
    $("refreshBtn").onclick = ()=> loadCards();
    $("printBtn").onclick = ()=> window.print();
    $("filterClass").addEventListener("input", ()=> loadCards());
    $("searchInput").addEventListener("input", ()=> loadCards());

    function clearForm(){
      ["st_id","st_name","st_class","st_hw","st_classwork","st_activity","st_research","st_theoretical","st_practical","st_absence","custom_note"].forEach(i=>$(i).value="");
      $("st_notes").value = "لا يوجد";
    }

    async function loadCards(focusId){
      const klass  = $("filterClass").value.trim();
      const search = norm($("searchInput").value);

      const base = collection(db,"students");
      const qy   = klass ? query(base, where("Class","==",klass)) : base;
      const qs   = await getDocs(qy);

      let arr = [];
      qs.forEach(d=>{ const s=d.data(); s.id=d.id; arr.push(s); });
      arr.sort((a,b)=> coll.compare(a.Name||"", b.Name||""));

      if(search){
        arr = arr.filter(s => norm(s.Name).includes(search) || norm(s.id).includes(search));
      }

      $("cardsWrap").innerHTML = arr.length
        ? arr.map(s => cardHTML(s)).join("")
        : `<div class="muted">لا يوجد طلاب</div>`;

      if(focusId){
        const el = document.querySelector(`[data-id="${focusId}"]`);
        if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
      }
      bindCardEvents();
    }

    function cardHTML(s){
      const note = s.Notes || "لا يوجد";
      const [baseNote, customPart] = splitNote(note);

      return `
        <div class="st-card" data-id="${s.id}">
          <div class="st-head">
            <div>
              <div class="name">${s.Name||""}</div>
              <div class="muted">ID: <span class="pill">${s.id}</span></div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <input class="in-class" value="${s.Class||""}" placeholder="الفصل">
              <button class="mini ghost mv-btn" title="نقل للفصل">نقل</button>
              <button class="mini danger del-btn">حذف</button>
            </div>
          </div>

          <div class="line"></div>

          <div class="nums">
            ${numBox("Hw","واجب", s.Hw)}
            ${numBox("Classwork","صفي", s.Classwork)}
            ${numBox("Activity","نشاط", s.Activity)}
          </div>
          <div class="nums">
            ${numBox("Research","بحث", s.Research)}
            ${numBox("Theoretical","نظري", s.Theoretical)}
            ${numBox("Practical","عملي", s.Practical)}
          </div>
          <div class="nums">
            ${numBox("Absence","غياب", s.Absence)}
            <div style="display:flex;flex-direction:column;gap:6px">
              <div class="muted">المجموع</div>
              <div class="total" data-total>${num(s.Total)}</div>
            </div>
            <div></div>
          </div>

          <div class="line"></div>

          <div class="note-wrap">
            <select class="sel-note">
              ${notesOptionsHTML(baseNote)}
            </select>
            <input class="custom-note" placeholder="ملاحظة خاصة (اختياري)" value="${customPart}">
          </div>

          <div class="actions">
            <button class="mini ok save-btn">حفظ</button>
          </div>
        </div>
      `;
    }

    function numBox(field, label, value){
      const v = Number(value||0);
      return `
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="muted">${label}</div>
          <div class="score-row">
            <button class="mini ghost minus" data-field="${field}">−</button>
            <input type="number" class="in-num" data-field="${field}" value="${v}">
            <button class="mini ok plus" data-field="${field}">+</button>
          </div>
        </div>
      `;
    }

    function splitNote(full){
      if(!full) return ["لا يوجد",""];
      const idx = full.indexOf(" — ");
      if(idx===-1) return [full,""];
      return [full.slice(0,idx), full.slice(idx+3)];
    }

    function bindCardEvents(){
      document.querySelectorAll(".st-card").forEach(card=>{
        const id = card.dataset.id;
        const numInputs = card.querySelectorAll(".in-num");
        const totalElem = card.querySelector("[data-total]");

        const getVals = ()=> {
          const vals = {};
          numInputs.forEach(i=> vals[i.dataset.field] = num(i.value));
          return vals;
        };
        const updateTotal = ()=>{
          const v = getVals();
          totalElem.textContent = computeTotal(v.Hw,v.Classwork,v.Activity,v.Research,v.Theoretical,v.Practical);
        };

        card.querySelectorAll(".plus").forEach(btn=>{
          btn.onclick = ()=> {
            const field = btn.dataset.field;
            const input = card.querySelector(`.in-num[data-field="${field}"]`);
            input.stepUp(); input.dispatchEvent(new Event("input")); updateTotal();
          };
        });
        card.querySelectorAll(".minus").forEach(btn=>{
          btn.onclick = ()=> {
            const field = btn.dataset.field;
            const input = card.querySelector(`.in-num[data-field="${field}"]`);
            input.stepDown(); input.dispatchEvent(new Event("input")); updateTotal();
          };
        });
        numInputs.forEach(inp=> inp.addEventListener("input", updateTotal));

        // حفظ بطاقة
        card.querySelector(".save-btn").onclick = async ()=>{
          const v = getVals();
          const baseNote = card.querySelector(".sel-note").value || "لا يوجد";
          const custom   = (card.querySelector(".custom-note").value||"").trim();
          const finalNote = custom ? `${baseNote} — ${custom}` : baseNote;

          const payload = {
            Class: card.querySelector(".in-class").value.trim(),
            Hw: v.Hw, Classwork: v.Classwork, Activity: v.Activity,
            Research: v.Research, Theoretical: v.Theoretical, Practical: v.Practical,
            Absence: v.Absence || 0,
            Notes: finalNote,
            Total: computeTotal(v.Hw,v.Classwork,v.Activity,v.Research,v.Theoretical,v.Practical)
          };
          await setDoc(doc(db,"students", id), payload, { merge:true });
          card.style.outline = "2px solid #2ecc71";
          setTimeout(()=> card.style.outline="none", 700);
        };

        // نقل فصل
        card.querySelector(".mv-btn").onclick = async ()=>{
          const newClass = card.querySelector(".in-class").value.trim();
          if(!newClass){ alert("اكتب الفصل أولاً"); return; }
          await setDoc(doc(db,"students", id), { Class:newClass }, { merge:true });
          card.style.outline = "2px solid #4f8cff";
          setTimeout(()=> card.style.outline="none", 700);
        };

        // حذف
        card.querySelector(".del-btn").onclick = async ()=>{
          if(!confirm("حذف هذا الطالب؟")) return;
          await deleteDoc(doc(db,"students",id));
          card.remove();
        };
      });
    }
  </script>
</body>
</html>
