<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>لوحة تحكم المشرف</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
  <style>
    body { font-family: sans-serif; direction: rtl; text-align: center; background: #f0f2f5; }
    .box { background: white; width: 300px; margin: 100px auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="box">
    <h2>تسجيل دخول المشرف</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" />
    <input type="password" id="password" placeholder="كلمة المرور" />
    <button onclick="login()">تسجيل الدخول</button>
    <p id="msg"></p>
  </div>

  <script>
    // إعدادات Firebase الخاصة بك 🔥
    const firebaseConfig = {
      apiKey: "AIzaSyBBx_pv6FEzGw7OyDHNj6u6D9y0Q_Ib5b",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.appspot.com",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4",
      measurementId: "G-7FW8J3J4GN"
    };

    // تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .then((user) => {
          document.getElementById("msg").innerText = "✅ تم تسجيل الدخول بنجاح";
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        })
        .catch((error) => {
          document.getElementById("msg").innerText = "❌ خطأ في البريد أو كلمة المرور";
          console.error(error);
        });
    }
  </script>
</body>
</html>
