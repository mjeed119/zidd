<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>لوحة المعلّم</title>
  <style>
    :root{--bg:#0b1220;--card:#101a2b;--ink:#e8f0ff;--muted:#9fb3d1;--accent:#4f8cff;--line:#1a2945}
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;background:#0d1728}
    .muted{color:var(--muted)}
    main{max-width:1100px;margin:18px auto;padding:0 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,select,textarea{background:#0f1a2d;color:var(--ink);border:1px solid #23365b;border-radius:10px;padding:10px}
    button{background:#13203a;color:var(--ink);border:1px solid #2a416e;border-radius:10px;padding:9px 12px;cursor:pointer}
    button.primary{background:var(--accent);border-color:#3f70cc}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid var(--line);padding:8px;text-align:center}
    th{background:#0e1a30}
    .pill{display:inline-flex;gap:8px;align-items:center;background:#0f1f38;border:1px solid #263a64;border-radius:999px;padding:6px 10px}
    .pill input{background:transparent;border:none;padding:0;min-width:80px}
    .danger{background:#3a0f18;border-color:#6e2632}
    .ok{color:#8ad28a}
  </style>
</head>
<body>
<header>
  <div class="row">
    <strong>لوحة المعلّم</strong>
    <span id="who" class="muted">—</span>
  </div>
  <div class="row">
    <a href="index.html"><button>بوابة الطلاب</button></a>
    <button id="logout">تسجيل الخروج</button>
  </div>
</header>

<main>
  <!-- إعدادات المعلّم -->
  <div class="card">
    <div class="row">
      <div class="pill">
        <span>الاسم الظاهر:</span>
        <input id="displayName" placeholder="مثال: بندر المباركي" />
        <button id="saveMeta">حفظ</button>
        <span id="metaMsg" class="muted"></span>
      </div>

      <div class="pill" style="flex-wrap:wrap">
        <span>البنود:</span>
        <div id="catsWrap" class="row"></div>
        <button id="addCat">+ إضافة بند</button>
      </div>

      <div class="pill">
        <span>فلترة بالفصل:</span>
        <select id="classFilter"><option value="">الكل</option></select>
        <button id="refresh">تحديث</button>
      </div>
    </div>
  </div>

  <!-- رفع الطلاب دفعة واحدة -->
  <div class="card">
    <h3 style="margin:0 0 8px">رفع الطلاب (نسخ/لصق من Excel)</h3>
    <p class="muted">الصيغة: <code>ID,Name,Class</code> أو مفصولة بـ <code>Tab</code>. سطر لكل طالب.</p>
    <textarea id="bulk" rows="6" style="width:100%;"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="parse" class="primary">استيراد</button>
      <span id="bulkMsg" class="muted"></span>
    </div>
  </div>

  <!-- جدول الطلاب -->
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h3 style="margin:0">الطلاب</h3>
      <button id="addOne">+ إضافة طالب يدوي</button>
    </div>
    <div style="overflow:auto">
      <table id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  // ==== إعدادات مشروعك ====
  const firebaseConfig = {
    apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
    authDomain: "students-portal-9eda8.firebaseapp.com",
    projectId: "students-portal-9eda8",
    storageBucket: "students-portal-9eda8.firebasestorage.app",
    messagingSenderId: "279588301357",
    appId: "1:279588301357:web:37f0ad440810aed4a166a4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // عناصر
  const who = document.getElementById("who");
  const logoutBtn = document.getElementById("logout");
  const displayName = document.getElementById("displayName");
  const saveMetaBtn = document.getElementById("saveMeta");
  const metaMsg = document.getElementById("metaMsg");
  const catsWrap = document.getElementById("catsWrap");
  const classFilter = document.getElementById("classFilter");
  const refreshBtn = document.getElementById("refresh");
  const bulk = document.getElementById("bulk");
  const parseBtn = document.getElementById("parse");
  const bulkMsg = document.getElementById("bulkMsg");
  const addOneBtn = document.getElementById("addOne");
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");

  const collator = new Intl.Collator('ar');

  let teacherId = null;       // بريد المعلّم (lowercase)
  let categories = [];        // قائمة البنود
  let students = [];          // كل الطلاب
  let debouncers = new Map(); // لحفظ تلقائي مؤجل

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href="login.html"; return; }
    teacherId = (user.email || "").toLowerCase();
    who.textContent = user.email;

    await ensureMetaDoc();      // يتأكد يوجد meta/default
    await loadMeta();           // يقرأ البنود واسم العرض
    await loadStudents();       // يقرأ الطلاب
    renderAll();                // يرسم الواجهة
  });

  logoutBtn.onclick = ()=> signOut(auth);

  async function ensureMetaDoc(){
    const ref = doc(db, "teachers", teacherId, "meta", "default");
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref, { displayName: teacherId, categories: ["Hw","نشاط","مشروع","نظري","عملي","غياب"] });
    }
  }

  async function loadMeta(){
    const ref = doc(db, "teachers", teacherId, "meta", "default");
    const snap = await getDoc(ref);
    const data = snap.data() || {};
    categories = Array.isArray(data.categories) ? data.categories : [];
    displayName.value = data.displayName || teacherId;
  }

  async function loadStudents(){
    const qy = query(collection(db, "teachers", teacherId, "students"), orderBy("Name"));
    const qs = await getDocs(qy);
    students = [];
    qs.forEach(d => students.push({ id:d.id, ...d.data() }));
    // عَبّي قائمة الفصول
    const classes = [...new Set(students.map(s => String(s.Class||"غير محدد"))) ].sort(collator.compare);
    classFilter.innerHTML = `<option value="">الكل</option>` + classes.map(c=>`<option value="${c}">${c}</option>`).join("");
  }

  function renderAll(){
    // البنود
    catsWrap.innerHTML = "";
    categories.forEach((c,idx)=>{
      const pill = document.createElement("div");
      pill.className = "pill";
      pill.innerHTML = `
        <span>${idx+1}</span>
        <input value="${c}" data-idx="${idx}" />
        <button class="danger" data-del="${idx}">حذف</button>
      `;
      catsWrap.appendChild(pill);
    });

    // رأس الجدول
    const cols = ["ID","الاسم","الفصل", ...categories];
    thead.innerHTML = "<tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";

    // جسم الجدول
    renderRows();
  }

  function renderRows(){
    const cls = classFilter.value;
    const list = students
      .filter(s => !cls || String(s.Class||"")===cls)
      .sort((a,b)=> collator.compare(a.Name||"", b.Name||""));

    tbody.innerHTML = "";
    for(const s of list){
      const tr = document.createElement("tr");
      // خلايا ثابتة
      tr.appendChild(tdText(s.id));
      tr.appendChild(tdInputText(s.id,"Name", s.Name||""));
      tr.appendChild(tdInputText(s.id,"Class", s.Class||""));

      // خلايا البنود
      for(const key of categories){
        tr.appendChild(tdInputNumber(s.id, key, Number(s[key]||0)));
      }
      tbody.appendChild(tr);
    }
  }

  function tdText(text){
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }
  function tdInputText(id, field, value){
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.value = value; inp.style.minWidth="120px";
    inp.oninput = ()=> saveField(id, field, inp.value);
    td.appendChild(inp);
    return td;
  }
  function tdInputNumber(id, field, value){
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.type="number"; inp.step="1"; inp.value = isFinite(value)? value : 0; inp.style.width="90px";
    inp.oninput = ()=> saveField(id, field, Number(inp.value||0));
    td.appendChild(inp);
    return td;
  }

  // حفظ بحجز (debounce) لتقليل الكتابات
  function saveField(id, field, value){
    const key = id+"::"+field;
    clearTimeout(debouncers.get(key));
    debouncers.set(key, setTimeout(async ()=>{
      const ref = doc(db, "teachers", teacherId, "students", id);
      await setDoc(ref, { [field]: value }, { merge:true });
      // حدث نسخة الذاكرة
      const s = students.find(x=>x.id===id);
      if(s) s[field] = value;
    }, 400));
  }

  // حفظ meta (اسم العرض + البنود)
  saveMetaBtn.onclick = async ()=>{
    // اجمع البنود من الواجهة
    const inputs = catsWrap.querySelectorAll('input[data-idx]');
    const arr = [...inputs].map(i => i.value.trim()).filter(Boolean);
    categories = arr;
    // اكتب meta
    await setDoc(doc(db,"teachers",teacherId,"meta","default"), {
      displayName: displayName.value.trim() || teacherId,
      categories
    }, { merge:true });
    metaMsg.textContent = "✓ تم الحفظ";
    setTimeout(()=> metaMsg.textContent="", 1500);
    // أعد رسم الجدول بالأعمدة الجديدة
    renderAll();
  };

  // إضافة بند جديد
  document.getElementById("addCat").onclick = ()=>{
    categories.push("بند جديد");
    renderAll();
  };

  // حذف بند
  catsWrap.addEventListener("click", (e)=>{
    const idx = e.target.getAttribute("data-del");
    if(idx==null) return;
    categories.splice(Number(idx),1);
    renderAll();
  });

  // فلترة وتحديث
  classFilter.onchange = renderRows;
  refreshBtn.onclick = async ()=> { await loadStudents(); renderAll(); };

  // استيراد دفعة واحدة
  parseBtn.onclick = async ()=>{
    const text = bulk.value.trim();
    if(!text){ bulkMsg.textContent = "لا يوجد بيانات."; return; }
    const lines = text.split(/\r?\n/).filter(Boolean);
    let ok=0, bad=0;
    for(const ln of lines){
      // يدعم , أو tab
      const parts = ln.split(/\t|,/).map(s=>s.trim());
      if(parts.length < 3){ bad++; continue; }
      const [idRaw, name, cls] = parts;
      const id = idRaw.replace(/\s+/g,""); // نظّف
      if(!id){ bad++; continue; }

      // جهّز قيم مبدئية للبنود
      const base = { Name: name, Class: cls };
      for(const k of categories) base[k] = Number(base[k]||0);
      // اكتب
      await setDoc(doc(db,"teachers",teacherId,"students", id), base, { merge:true });
      ok++;
    }
    bulkMsg.innerHTML = `تم استيراد <b class="ok">${ok}</b> سطر${ok!==1?"اً":""}، ورفض ${bad}.`;
    await loadStudents();
    renderAll();
  };

  // إضافة طالب يدوي
  addOneBtn.onclick = async ()=>{
    const id = prompt("أدخل رقم/هوية الطالب (ID):");
    if(!id) return;
    const name = prompt("اسم الطالب:");
    const cls  = prompt("الفصل (مثال 304):");
    const base = { Name:name||"", Class:cls||"" };
    for(const k of categories) base[k]=0;
    await setDoc(doc(db,"teachers",teacherId,"students", String(id).trim()), base, { merge:true });
    await loadStudents();
    renderAll();
  };
</script>
</body>
</html>
