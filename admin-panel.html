<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>لوحة المشرف</title>
  <style>
    :root{--bg:#0b1220;--card:#101a2b;--ink:#e8f0ff;--muted:#9fb3d1;--accent:#4f8cff;--line:#1a2945}
    *{box-sizing:border-box;font-family:system-ui,Segoe UI,Tahoma,Arial}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{padding:16px 18px;background:#0d1728;border-bottom:1px solid #1b2a44;display:flex;gap:12px;align-items:center;justify-content:space-between}
    .muted{color:var(--muted)}
    .btn{padding:10px 14px;border-radius:12px;border:1px solid #243756;background:#0f1a2d;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
    .btn.primary{background:var(--accent);border-color:#3f70cc}
    main{max-width:1100px;margin:22px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
    input,select{width:100%;padding:10px;border-radius:12px;border:1px solid #243756;background:#0f1a2d;color:var(--ink)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center}
  </style>
</head>
<body>
<header>
  <div>
    <strong>لوحة المشرف</strong>
    <span class="muted" id="who" style="margin-inline-start:8px">—</span>
  </div>
  <div>
    <a class="btn" href="dashboard.html">وضع الجدول</a>
    <button class="btn" id="logout">تسجيل الخروج</button>
  </div>
</header>

<main>
  <div class="card">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
      <input id="filterClass" placeholder="فلترة بالفصل (مثال: 105)">
      <input id="search" placeholder="بحث بالاسم أو ID">
      <button class="btn" id="refresh">تحديث</button>
      <span class="muted">الدور: <b id="role">…</b></span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">الطلاب</h3>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>الاسم</th><th>الفصل</th><th>Hw</th><th>Classwork</th><th>Activity</th>
            <th>Research</th><th>Theoretical</th><th>Practical</th><th>Absence</th><th>Total</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  // ضع إعداداتك هنا (نفسها اللي نسختها)
  const firebaseConfig = {
    apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
    authDomain: "students-portal-9eda8.firebaseapp.com",
    projectId: "students-portal-9eda8",
    storageBucket: "students-portal-9eda8.firebasestorage.app",
    messagingSenderId: "279588301357",
    appId: "1:279588301357:web:37f0ad440810aed4a166a4",
    measurementId: "G-7FW8J3J4GN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  const $ = id => document.getElementById(id);
  const num = v => Number(v||0);
  const total = s => num(s.Hw)+num(s.Classwork)+num(s.Activity)+num(s.Research)+num(s.Theoretical)+num(s.Practical);

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href="login.html"; return; }
    $("who").textContent = user.email || "—";
    // تحقق الدور
    const uref = doc(db,"users", (user.email||"").toLowerCase());
    const usnap = await getDoc(uref);
    const role = usnap.exists() ? (usnap.data().role||"") : "";
    $("role").textContent = role || "—";
    if(role!=="admin"){ location.href="teacher.html"; return; }
    load();
  });

  $("logout").onclick = ()=> signOut(auth);

  $("refresh").onclick = ()=> load();
  $("filterClass").addEventListener("input", ()=> load());
  $("search").addEventListener("input", ()=> load());

  async function load(){
    const cls = $("filterClass").value.trim();
    const qBase = collection(db,"students");
    const qy   = cls ? query(qBase, where("Class","==",cls)) : qBase;
    const qs   = await getDocs(qy);

    const search = ($("search").value||"").toLowerCase().trim();
    const rows=[];
    qs.forEach(d=>{
      const s = d.data(); s.id=d.id;
      if(search && !(String(s.id).toLowerCase().includes(search) || (s.Name||"").toLowerCase().includes(search))) return;
      rows.push(`
        <tr>
          <td>${s.id}</td>
          <td>${s.Name||""}</td>
          <td>${s.Class||""}</td>
          <td>${num(s.Hw)}</td>
          <td>${num(s.Classwork)}</td>
          <td>${num(s.Activity)}</td>
          <td>${num(s.Research)}</td>
          <td>${num(s.Theoretical)}</td>
          <td>${num(s.Practical)}</td>
          <td>${num(s.Absence)}</td>
          <td><b>${num(s.Total||total(s))}</b></td>
        </tr>
      `);
    });
    $("rows").innerHTML = rows.join("") || `<tr><td colspan="11" class="muted">لا يوجد بيانات</td></tr>`;
  }
</script>
</body>
</html>
