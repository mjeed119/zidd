<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>بوابة الدرجات</title>
  <style>
    :root{
      --bg:#f5f7fb; --card:#ffffff; --border:#e6e8ef; --muted:#7c8499;
      --primary:#3b5bdb; --primary-weak:#ecf1ff; --text:#0f1220;
      --badge:#fff3bf; --badge-text:#7a5d00;
    }
    html[data-theme="dark"]{
      --bg:#0f1220; --card:#171a2b; --border:#2a2e43; --muted:#a2a8c3;
      --primary:#7b90ff; --primary-weak:#1e2450; --text:#e8ecff;
      --badge:#3b2f16; --badge-text:#ffe9b3;
    }
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;margin:0}
    .container{max-width:900px;margin:24px auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .btn{padding:10px 14px;border-radius:10px;background:var(--primary-weak);cursor:pointer;font-weight:600;color:var(--text);border:none}
    select{padding:10px;border-radius:10px;border:1px solid var(--border);min-width:240px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid var(--border);padding:10px;text-align:center}
    th{background:#f3f5fb}
    html[data-theme="dark"] th{background:#1d223a}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .badge{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:999px;background:var(--badge);color:var(--badge-text);font-weight:700;font-size:12px}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <main class="container">
    <div class="row" style="justify-content:space-between;">
      <h1>بوابة الدرجات</h1>
      <div class="row">
        <button class="btn" id="toggleTheme">الوضع الداكن</button>
      </div>
    </div>

    <section class="card">
      <div class="row">
        <label>اختر المعلّم:</label>
        <select id="teacherSelect"><option value="">— اختر —</option></select>
      </div>
    </section>

    <section class="card" id="classCard" style="display:none;">
      <div class="row">
        <label>اختر الفصل:</label>
        <select id="classSelect"><option value="">— اختر —</option></select>
      </div>
    </section>

    <section class="card" id="studentCard" style="display:none;">
      <div class="row">
        <label>اختر اسمك:</label>
        <select id="studentSelect"><option value="">— اختر —</option></select>
      </div>
    </section>

    <section class="card" id="gradesSection" style="display:none;">
      <h2 id="studentHeader"></h2>
      <div id="studentNoteWrap" class="muted"></div>
      <div id="gradesTableWrapper"></div>
      <p>المجموع: <span id="totalScore">—</span></p>
      <p>النسبة: <span id="percentScore">—</span>%</p>
    </section>

    <footer><small>© <span id="year"></span> بوابة الدرجات</small></footer>
  </main>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import {
      getFirestore, collection, doc, getDocs, getDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
  
    // إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
      authDomain: "students-portal-9eda8.firebaseapp.com",
      projectId: "students-portal-9eda8",
      storageBucket: "students-portal-9eda8.firebasestorage.app",
      messagingSenderId: "279588301357",
      appId: "1:279588301357:web:37f0ad440810aed4a166a4"
    };
  
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
  
    // عناصر الصفحة
    const teacherSelect  = document.getElementById("teacherSelect");
    const classSelect    = document.getElementById("classSelect");
    const studentSelect  = document.getElementById("studentSelect");
    const classCard      = document.getElementById("classCard");
    const studentCard    = document.getElementById("studentCard");
    const gradesSection  = document.getElementById("gradesSection");
    const studentHeader  = document.getElementById("studentHeader");
    const studentNoteWrap= document.getElementById("studentNoteWrap");
    const gradesTableWrapper = document.getElementById("gradesTableWrapper");
    const totalScoreEl   = document.getElementById("totalScore");
    const percentScoreEl = document.getElementById("percentScore");
  
    document.getElementById("year").textContent = new Date().getFullYear();
    const collator = new Intl.Collator('ar');
  
    // ذاكرة
    const STATE = {
      teachers: {},          // email -> {displayName, allowedClasses}
      studentsByClass: {},   // class -> [students...]
      currentTeacher: null,  // email
      currentCategories: []  // إن كنت تستخدمها لاحقاً
    };
  
    // 1) حمّل الطلاب مرّة واحدة من /students
    async function loadAllStudents(){
      const qStu = query(collection(db, "students"), orderBy("Name"));
      const snap = await getDocs(qStu);
      STATE.studentsByClass = {};
      snap.forEach(d=>{
        const s = { id:d.id, ...d.data() };
        const cls = String(s.Class || "غير محدد");
        (STATE.studentsByClass[cls] ||= []).push(s);
      });
      // رتّب الأسماء داخل كل فصل
      Object.values(STATE.studentsByClass)
        .forEach(list=> list.sort((a,b)=>collator.compare(a.Name||"", b.Name||"")));
    }
  
    // 2) حمّل قائمة المعلّمين من /users (role = teacher/admin)
    async function loadTeachers(){
      const qs = await getDocs(collection(db, "users"));
      const items = [];
      qs.forEach(d=>{
        const data = d.data() || {};
        const role = (data.role || "").toLowerCase();
        if(role === "teacher" || role === "admin"){
          const email = d.id.toLowerCase();
          STATE.teachers[email] = {
            displayName: data.displayName || email,
            allowedClasses: Array.isArray(data.allowedClasses) ? data.allowedClasses.map(String) :
                             Array.isArray(data.classes) ? data.classes.map(String) : [] // دعم الاسم القديم
          };
          items.push(email);
        }
      });
      // املأ السلكت
      teacherSelect.innerHTML = '<option value="">— اختر —</option>';
      items.sort(collator.compare).forEach(email=>{
        const opt = document.createElement("option");
        opt.value = email;
        opt.textContent = STATE.teachers[email].displayName;
        teacherSelect.appendChild(opt);
      });
    }
  
    // 3) عند اختيار معلّم -> احضر الفصول المسموح بها والتي لها طلاب فعلاً
    teacherSelect.addEventListener("change", ()=>{
      resetBelow("teacher");
      const email = teacherSelect.value;
      if(!email) return;
      STATE.currentTeacher = email;
  
      const allowed = (STATE.teachers[email]?.allowedClasses || []).map(String);
      // إن ما فيه allowedClasses، نعرض كل الفصول الموجودة
      const allClasses = Object.keys(STATE.studentsByClass);
      const classesToShow = (allowed.length ? allowed.filter(c => STATE.studentsByClass[c]?.length) : allClasses)
                            .sort(collator.compare);
  
      classSelect.innerHTML = '<option value="">— اختر —</option>';
      classesToShow.forEach(cls=>{
        const opt = document.createElement("option");
        opt.value = cls; opt.textContent = cls;
        classSelect.appendChild(opt);
      });
      classCard.style.display = "block";
    });
  
    // 4) عند اختيار فصل -> املأ أسماء الطلاب من /students حسب الفصل
    classSelect.addEventListener("change", ()=>{
      resetBelow("class");
      const cls = classSelect.value;
      if(!cls) return;
      const list = STATE.studentsByClass[cls] || [];
      studentSelect.innerHTML = '<option value="">— اختر —</option>';
      list.forEach(s=>{
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.Name || s.id;
        studentSelect.appendChild(opt);
      });
      studentCard.style.display = "block";
    });
  
    // 5) عرض درجات الطالب
    studentSelect.addEventListener("change", ()=>{
      gradesSection.style.display = "none";
      const id = studentSelect.value;
      if(!id) return;
      const cls = classSelect.value;
      const s = (STATE.studentsByClass[cls] || []).find(x=>x.id===id);
      if(s) renderGrades(s);
    });
  
    function renderGrades(s){
      studentHeader.textContent = `${s.Name||s.id} — ${s.Class || 'غير محدد'}`;
      const noteText = s.Notes ? String(s.Notes) : "لا يوجد";
      studentNoteWrap.innerHTML = `<span class="badge">الملاحظة: ${noteText}</span>`;
  
      // الأعمدة الثابتة (نفس القديمة)
      const cols = [
        ["Hw","الواجبات"],
        ["Research","البحث"],
        ["Activity","النشاط الصفي"],
        ["Theoretical","الاختبار النظري"],
        ["Practical","الاختبار العملي"],
        ["Absence","الغياب"]
      ];
  
      const table=document.createElement("table");
      table.innerHTML = "<thead><tr><th>البند</th><th>الدرجة</th></tr></thead>";
      const tbody=document.createElement("tbody");
      let total=0;
  
      for(const [key,label] of cols){
        const val = Number(s[key] || 0);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${label}</td><td>${val}</td>`;
        tbody.appendChild(tr);
        if(key !== "Absence") total += val;
      }
      const trNote = document.createElement("tr");
      trNote.innerHTML = `<td>الملاحظات</td><td>${noteText}</td>`;
      tbody.appendChild(trNote);
  
      table.appendChild(tbody);
      gradesTableWrapper.innerHTML = "";
      gradesTableWrapper.appendChild(table);
  
      totalScoreEl.textContent = total;
      percentScoreEl.textContent = total.toFixed(2);
      gradesSection.style.display = "block";
    }
  
    function resetBelow(level){
      if(level==="teacher"){
        classSelect.innerHTML = '<option value="">— اختر —</option>';
        studentSelect.innerHTML = '<option value="">— اختر —</option>';
        classCard.style.display = "none";
        studentCard.style.display = "none";
        gradesSection.style.display = "none";
      }else if(level==="class"){
        studentSelect.innerHTML = '<option value="">— اختر —</option>';
        studentCard.style.display = "none";
        gradesSection.style.display = "none";
      }
    }
  
    // تشغيل
    await loadAllStudents();
    await loadTeachers();
  
    // الوضع الداكن
    const toggle=document.getElementById("toggleTheme");
    function applyTheme(t){
      document.documentElement.dataset.theme=t;
      localStorage.setItem("theme",t);
      toggle.textContent=t==="dark"?"الوضع الفاتح":"الوضع الداكن";
    }
    applyTheme(localStorage.getItem("theme")||"light");
    toggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
  </script>
</body>
</html>
