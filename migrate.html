<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>نقل الطلاب من /students إلى /teachers/{email}/students</title>
<style>
  body{font-family:system-ui;max-width:900px;margin:24px auto;padding:16px}
  h1{font-size:22px;margin:0 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  input{padding:10px;border:1px solid #ccd;border-radius:10px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #ccd;background:#eef;cursor:pointer}
  #log{background:#f8fafc;border:1px solid #e5e7eb;padding:12px;border-radius:10px;height:260px;overflow:auto;white-space:pre-wrap}
  .muted{color:#6b7280}
</style>

<h1>نقل الطلاب من <code>/students</code> إلى <code>teachers/{email}/students</code></h1>
<p class="muted">السكربت يقسم حسب فصول المعلم الموجودة في <code>users/{email}.allowedClasses</code>. يجب تسجيل الدخول بحساب يملك صلاحية الكتابة.</p>

<div class="row">
  <input id="authEmail" placeholder="بريد الأدمن" style="min-width:260px">
  <input id="authPass" type="password" placeholder="كلمة السر">
  <button id="loginBtn">تسجيل الدخول</button>
  <span id="authState" class="muted">غير مسجل</span>
</div>

<div class="row">
  <label>إيميل المعلّم:</label>
  <input id="teacherEmail" placeholder="example@school.com" style="min-width:320px">
  <button id="dryBtn">محاكاة (بدون كتابة)</button>
  <button id="runBtn">نقل الآن</button>
</div>

<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, writeBatch, doc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0X_pv6FEzGw70YdDHNj0u6D9YoQ_Ib5o",
  authDomain: "students-portal-9eda8.firebaseapp.com",
  projectId: "students-portal-9eda8",
  storageBucket: "students-portal-9eda8.firebasestorage.app",
  messagingSenderId: "279588301357",
  appId: "1:279588301357:web:37f0ad440810aed4a166a4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const el = id => document.getElementById(id);
const out = el("log");
const log = (t)=>{ out.textContent += t + "\n"; out.scrollTop = out.scrollHeight; };

onAuthStateChanged(auth, (u)=>{
  el("authState").textContent = u ? ("مسجل: " + (u.email||"")) : "غير مسجل";
});

el("loginBtn").onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, el("authEmail").value.trim(), el("authPass").value);
    log("✔️ تم تسجيل الدخول.");
  }catch(e){
    console.error(e); log("❌ فشل تسجيل الدخول: " + (e.code||e.message));
  }
};

async function getAllowedClasses(emailLower){
  // نقرأ users/{email} (الـ ID يجب أن يكون نفس البريد lowercase)
  const usersSnap = await getDocs(collection(db,"users"));
  let allowed = null;
  usersSnap.forEach(d=>{
    if (d.id.toLowerCase() === emailLower) {
      const a = d.data().allowedClasses;
      if (Array.isArray(a) && a.length) allowed = a.map(v=>String(v));
    }
  });
  return allowed;
}

async function gatherLegacyStudents(classes){
  const all = await getDocs(query(collection(db,"students"), orderBy("Name")));
  const list = [];
  all.forEach(s=>{
    const d = s.data();
    const cls = String(d.Class||"");
    if (!classes || classes.includes(cls)) list.push({ id:s.id, ...d });
  });
  return list;
}

async function migrate(email, dryRun=false){
  out.textContent = "";
  const emailLower = (email||"").trim().toLowerCase();
  if(!emailLower){ log("❌ أدخل إيميل المعلّم."); return; }

  const user = auth.currentUser;
  if(!user){ log("❌ يجب تسجيل الدخول أولاً."); return; }

  log("المعلم: " + emailLower);

  const allowed = await getAllowedClasses(emailLower);
  log("الفصول المعتمدة: " + (allowed ? allowed.join(", ") : "(غير محددة — سيتم نقل الكل)"));

  const students = await gatherLegacyStudents(allowed);
  log("عدد السجلات المراد نقلها: " + students.length);

  if (dryRun){ log("✅ محاكاة فقط — لا يوجد كتابة."); return; }

  // كتابة على دفعات (أمان تحت حد 500)
  let batch = writeBatch(db);
  let count = 0, batches = 1;
  for (const s of students){
    const ref = doc(db, "teachers", emailLower, "students", s.id);
    batch.set(ref, s, { merge:true });
    count++;
    if (count % 450 === 0){
      await batch.commit();
      log(`✔️ تم تنفيذ الدفعة #${batches} (إجمالي ${count})`);
      batch = writeBatch(db);
      batches++;
    }
  }
  await batch.commit();
  log(`🎉 اكتمل النقل. الإجمالي: ${count} سجل — عدد الدُفعات: ${batches}.`);
}

el("dryBtn").onclick = ()=> migrate(el("teacherEmail").value, true);
el("runBtn").onclick = ()=> migrate(el("teacherEmail").value, false);
</script>
